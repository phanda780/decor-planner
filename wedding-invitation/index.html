<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>#HandaSharmaGaya — Parth &amp; Tanisha</title>
<meta name="description" content="Parth &amp; Tanisha — 1&ndash;2 November 2026, The Uttrayan, Chakrata.">
<meta name="theme-color" content="#1e3b2c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/images/hero-marigold-arch.jpg" fetchpriority="high">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="progress" id="progress-bar" aria-hidden="true"></div>

<main id="app">

  <section class="panel panel-hero" id="panel-hero">
    <div class="panel-media"><img src="" alt="Marigold and floral arch overlooking the Chakrata mountains" fetchpriority="high"></div>
    <div class="panel-grade"></div>
    <div class="hero-body"></div>
  </section>

  <section class="panel panel-home" id="panel-home">
    <div class="home-split">
      <div class="frame-a"><img alt="The Uttrayan veranda, carved wood pillars overlooking the hills" loading="lazy"></div>
      <div class="frame-b"><img alt="Carved wood archway detail, The Uttrayan veranda" loading="lazy"></div>
    </div>
    <div class="home-seam"></div>
    <div class="panel-grade"></div>
    <div class="panel-content"></div>
  </section>

  <div id="events-wrap"></div>

  <section class="panel panel-travel" id="panel-travel">
    <div class="panel-media"><img alt="Terraced hillside road toward Chakrata" loading="lazy"></div>
    <div class="panel-grade"></div>
    <div class="travel-body"></div>
  </section>

  <section class="panel panel-rsvp" id="panel-rsvp">
    <div class="panel-media"><img src="assets/images/shaadi-aisle-wide.jpg" alt="" loading="lazy"></div>
    <div class="panel-grade"></div>
    <div class="rsvp-body"></div>
  </section>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>

</html>
